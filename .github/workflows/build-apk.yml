
name: FREE FIRE CAPA IA PRO - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      - name: Aceitar licenças Android
        shell: bash
        run: |
          yes | sdkmanager --licenses

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar componentes
        run: |
          sdkmanager --list_installed

      - name: Compilar aplicativo
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verificar APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FREE-FIRE-CAPA-IA-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
concurrency: 
